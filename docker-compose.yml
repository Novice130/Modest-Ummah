version: '3.8'

services:
  # Next.js Application
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: modest-ummah-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - UPLOAD_DIR=/app/uploads
      # Pirate Ship connector (WooCommerce-compatible surface at /wp-json)
      - WOO_SHIM_ENABLED=${WOO_SHIM_ENABLED}
      - WOO_SECRET_ENC_KEY=${WOO_SECRET_ENC_KEY}
      - WOO_AUTH_CALLBACK_HOSTS=${WOO_AUTH_CALLBACK_HOSTS}
      - PIRATESHIP_ORIGIN_NAME=${PIRATESHIP_ORIGIN_NAME}
      - PIRATESHIP_ORIGIN_COMPANY=${PIRATESHIP_ORIGIN_COMPANY}
      - PIRATESHIP_ORIGIN_STREET1=${PIRATESHIP_ORIGIN_STREET1}
      - PIRATESHIP_ORIGIN_STREET2=${PIRATESHIP_ORIGIN_STREET2}
      - PIRATESHIP_ORIGIN_CITY=${PIRATESHIP_ORIGIN_CITY}
      - PIRATESHIP_ORIGIN_STATE=${PIRATESHIP_ORIGIN_STATE}
      - PIRATESHIP_ORIGIN_ZIP=${PIRATESHIP_ORIGIN_ZIP}
      - PIRATESHIP_ORIGIN_PHONE=${PIRATESHIP_ORIGIN_PHONE}
      - PIRATESHIP_ORIGIN_EMAIL=${PIRATESHIP_ORIGIN_EMAIL}
      - BREVO_API_KEY=${BREVO_API_KEY}
    volumes:
      # Uploaded product images survive redeploys. Mount this on the
      # Hetzner host (Dokploy volume) at the same path.
      - uploads:/app/uploads
    networks:
      - modest-ummah-network
      - coolify

volumes:
  uploads:

networks:
  modest-ummah-network:
    driver: bridge
  coolify:
    external: true
