# ═══════════════════════════════════════════════════════
# CI/CD — Lint, Build, Image & Deploy
#
#   pull_request      quality -> build
#   push to main      quality -> build -> image -> deploy-staging
#   workflow_dispatch deploy-production (promote an already-built image by SHA)
#
# Nothing is built on a server. `image` pushes to GHCR:
#   ghcr.io/novice130/modest-ummah:staging-<sha>   + :staging (mutable, Dokploy pulls it)
#   ghcr.io/novice130/modest-ummah:prod-<sha>      (Hetzner pulls it via infra/hetzner/deploy.sh)
# Two builds per commit because NEXT_PUBLIC_* values are baked in at build time.
#
# Repository secrets
#   DATABASE_URL                        build job: `next build` prerenders against the DB
#   NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY  build job only (optional)
#   SENTRY_AUTH_TOKEN                   image job: source-map upload token (unset = no upload)
#   STAGING_BUILD_DATABASE_URL          image job: read-only role on the staging database
#   PROD_BUILD_DATABASE_URL             image job: read-only role on the production database
#   STAGING_DEPLOY_HOOK                 Dokploy deploy webhook URL (unset = staging deploy skipped)
#   CF_ACCESS_CLIENT_ID                 Cloudflare Access service token for the hook
#   CF_ACCESS_CLIENT_SECRET
#   TS_OAUTH_CLIENT_ID                  Tailscale OAuth client allowed to mint tag:ci nodes
#   TS_OAUTH_SECRET
#   DEPLOY_SSH_KEY                      private key whose forced command is deploy.sh
#   (GITHUB_TOKEN is provided by Actions and pushes/reads the GHCR package)
#
# Repository variables
#   STAGING_NEXT_PUBLIC_APP_URL                 PROD_NEXT_PUBLIC_APP_URL
#   STAGING_NEXT_PUBLIC_APP_NAME                PROD_NEXT_PUBLIC_APP_NAME   (default "Modest Ummah")
#   STAGING_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY  PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
#   STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID        PROD_NEXT_PUBLIC_GOOGLE_CLIENT_ID (optional)
#   STAGING_NEXT_PUBLIC_SENTRY_DSN              PROD_NEXT_PUBLIC_SENTRY_DSN (optional; empty = Sentry off)
#   PROD_HOST                                   tailnet name or IP of the production server
#   PROD_SSH_KNOWN_HOSTS                        known_hosts line(s) for PROD_HOST
#
# Environment
#   production                          gates deploy-production (add required reviewers)
# ═══════════════════════════════════════════════════════
name: CI/CD — Lint, Build, Image & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA to promote to production (its prod image must already exist)
        required: true
        type: string

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  IMAGE: ghcr.io/novice130/modest-ummah

jobs:
  # ─── Step 1: Lint & Type Check ───────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    # A production promotion ships an image that already passed these on push.
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Lint
        run: npm run lint || true  # Don't block on lint warnings for now

      - name: Type Check
        run: npx tsc --noEmit || true  # Report types but don't block

  # ─── Step 2: Build ──────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://modestummah.com
          NEXT_PUBLIC_APP_NAME: Modest Ummah
          NEXT_PUBLIC_POCKETBASE_URL: ''
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@placeholder/placeholder' }}

  # ─── Step 3: Build & Push Images (GHCR) ─────────────
  # `next build` queries the database (generateStaticParams in
  # app/shop/[category]/page.tsx plus the prerendered catalogue reads). The URL
  # reaches the Dockerfile's build step as a BuildKit secret, never a build-arg.
  # Catalogue pages are prerendered into the image, so each image builds against
  # its own environment's database. Use a read-only database role for these.
  image:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [quality, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:staging-${{ github.sha }}
            ${{ env.IMAGE }}:staging
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.STAGING_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.STAGING_NEXT_PUBLIC_APP_NAME || 'Modest Ummah' }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.STAGING_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.STAGING_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.STAGING_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=staging
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.2
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            database_url=${{ secrets.STAGING_BUILD_DATABASE_URL }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=staging
          cache-to: type=gha,scope=staging,mode=max

      - name: Build & push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:prod-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.PROD_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ vars.PROD_NEXT_PUBLIC_APP_NAME || 'Modest Ummah' }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.PROD_NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.PROD_NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.PROD_NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=0.05
            SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            database_url=${{ secrets.PROD_BUILD_DATABASE_URL }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,scope=prod,mode=max

  # ─── Step 4: Deploy Staging (Dokploy pulls :staging) ─
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions: {}
    steps:
      - name: Trigger staging deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_DEPLOY_HOOK }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::notice::STAGING_DEPLOY_HOOK is not set; skipping staging deploy."
            exit 0
          fi
          echo "Triggering staging deployment..."
          # --fail covers 4xx/5xx; a 3xx (Access login redirect, Dokploy
          # refusing the hook) is not a deployment either, so require 2xx.
          status="$(curl -X POST "$DEPLOY_HOOK" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --fail --silent --show-error --max-time 60 \
            --output /dev/null --write-out '%{http_code}')"
          case "$status" in
            2??) echo "Staging deployment triggered (HTTP $status)" ;;
            *)
              echo "::error::Staging deploy hook answered HTTP $status, expected 2xx."
              exit 1
              ;;
          esac

  # ─── Step 5: Promote to Production (manual, by SHA) ──
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      packages: read
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - name: Validate SHA
        run: |
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be the full 40-character lowercase commit SHA."
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify production image exists
        run: |
          if ! docker manifest inspect "${IMAGE}:prod-${SHA}" >/dev/null; then
            echo "::error::${IMAGE}:prod-${SHA} not found in GHCR. Only commits whose push-to-main run finished the image job can be promoted."
            exit 1
          fi
          echo "Found ${IMAGE}:prod-${SHA}"

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          PROD_HOST: ${{ vars.PROD_HOST }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$PROD_SSH_KNOWN_HOSTS" ] || [ -z "$PROD_HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY (secret), PROD_SSH_KNOWN_HOSTS and PROD_HOST (variables) must all be set."
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key"
          # The key's forced command on the server is deploy.sh; it receives
          # "<site> <sha>", health-checks the new containers and rolls back
          # (exiting non-zero, which fails this job) if they do not come up.
          ssh -i "$RUNNER_TEMP/ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=30 \
            "deploy@${PROD_HOST}" "modestummah ${SHA}"

      - name: Remove SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
