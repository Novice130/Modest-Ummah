name: modest_ummah
description: Modest Ummah — modest fashion and fine cubic-zirconia jewellery.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0

  # Storage — the JWT lives in the Keychain, never SharedPreferences.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Media
  cached_network_image: ^3.4.1

  # Payments
  flutter_stripe: ^14.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
  fonts:
    # Variable fonts — one file per family covers every weight the app uses,
    # which is smaller than shipping four static cuts each.
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
